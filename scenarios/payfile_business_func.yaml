# 前置条件：发放单已完成计算（场景一）
# 数据来源：data/query_details.yaml

name: "场景二：发放单计算取业务函数"
description: "发放单计算取业务函数：验证未审批时指定期间合计数→验证未审批时指定期间平均数"
tags:
  - payfile
  - business_func
  - regression

steps:
