    testcase: "testcases/api/test_query_details_after_calculate.py::TestQueryDetailsAfterCalculate::test_specified_sum_without_approve"
    critical: true

  - name: "验证未审批时指定期间平均数"
    testcase: "testcases/api/test_query_details_after_calculate.py::TestQueryDetailsAfterCalculate::test_specified_avg_without_approve"
    critical: true

# ===== 全局参数（从数据文件统一加载） =====
data_file: "data/query_details.yaml"
global_params_override: {}
